<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc"><title id="title">Feedback Inbox — Make room for every reply</title><desc id="desc">An illustrated triage desk with a status seal, waiting-time ledger and arrival calendar. Schematic product cover, not live metrics.</desc><rect width="1440" height="650" fill="#f5ecdf"/><rect width="18" height="650" fill="#b5412b"/><path d="M75 95h1290M75 565h1290" stroke="#d8c6b1"/><text x="80" y="68" font-family="sans-serif" font-size="13" letter-spacing="3" fill="#9a4d37">THE CORRESPONDENCE OBSERVATORY</text><text x="80" y="242" font-family="Georgia,serif" font-size="78" fill="#392a21">Feedback</text><text x="80" y="330" font-family="Georgia,serif" font-size="78" fill="#b5412b">Inbox.</text><text x="85" y="394" font-family="sans-serif" font-size="23" fill="#796352">Make room for every reply.</text><text x="85" y="448" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#796352">SEE THE WAIT. FIND THE LETTER. RESPOND.</text><g transform="translate(690 130)"><rect x="12" y="12" width="650" height="390" rx="8" fill="#d9c5ac" opacity=".45"/><rect width="650" height="390" rx="8" fill="#fffaf2" stroke="#dac5ac"/><path d="M225 0v390" stroke="#dac5ac" stroke-dasharray="4 5"/><text x="25" y="38" font-family="sans-serif" font-size="11" letter-spacing="2" fill="#95785f">THE OPEN LETTERS</text><circle cx="112" cy="150" r="65" fill="none" stroke="#6d8a73" stroke-width="16"/><circle cx="112" cy="150" r="65" fill="none" stroke="#c44f32" stroke-width="16" pathLength="100" stroke-dasharray="22 78" transform="rotate(-90 112 150)"/><circle cx="112" cy="150" r="65" fill="none" stroke="#ce9b47" stroke-width="16" pathLength="100" stroke-dasharray="18 82" stroke-dashoffset="-22" transform="rotate(-90 112 150)"/><path d="M83 135h58v38H83zm0 0 29 23 29-23" fill="none" stroke="#b5412b" stroke-width="2"/><g font-family="sans-serif" font-size="11" fill="#796352"><text x="38" y="258">NEW</text><text x="38" y="297">IN PROGRESS</text><text x="38" y="336">RESOLVED</text></g><g fill="#c44f32"><circle cx="25" cy="254" r="3"/><rect x="250" y="99" width="310" height="8" rx="2"/></g><g fill="#ce9b47"><circle cx="25" cy="293" r="3"/><rect x="250" y="160" width="215" height="8" rx="2"/></g><g fill="#6d8a73"><circle cx="25" cy="332" r="3"/><rect x="250" y="221" width="98" height="8" rx="2"/></g><g font-family="sans-serif" fill="#796352" font-size="12"><text x="250" y="38" letter-spacing="2">WAITING-TIME LEDGER</text><text x="250" y="84">7 DAYS OR MORE</text><text x="250" y="145">1–7 DAYS</text><text x="250" y="206">LESS THAN 24 HOURS</text><text x="250" y="277" font-size="10" letter-spacing="2">ARRIVAL CALENDAR</text></g><rect x="250" y="294" width="28" height="25" rx="2" fill="#f5e8d7"/><rect x="285" y="294" width="28" height="25" rx="2" fill="#d78c64"/><rect x="320" y="294" width="28" height="25" rx="2" fill="#b74b30"/><rect x="355" y="294" width="28" height="25" rx="2" fill="#e8b08c"/><rect x="390" y="294" width="28" height="25" rx="2" fill="#f5e8d7"/><rect x="425" y="294" width="28" height="25" rx="2" fill="#d78c64"/><rect x="460" y="294" width="28" height="25" rx="2" fill="#b74b30"/><rect x="495" y="294" width="28" height="25" rx="2" fill="#e8b08c"/><rect x="530" y="294" width="28" height="25" rx="2" fill="#f5e8d7"/><rect x="565" y="294" width="28" height="25" rx="2" fill="#d78c64"/><rect x="250" y="326" width="28" height="25" rx="2" fill="#b74b30"/><rect x="285" y="326" width="28" height="25" rx="2" fill="#e8b08c"/><rect x="320" y="326" width="28" height="25" rx="2" fill="#f5e8d7"/><rect x="355" y="326" width="28" height="25" rx="2" fill="#d78c64"/><rect x="390" y="326" width="28" height="25" rx="2" fill="#b74b30"/><rect x="425" y="326" width="28" height="25" rx="2" fill="#e8b08c"/><rect x="460" y="326" width="28" height="25" rx="2" fill="#f5e8d7"/><rect x="495" y="326" width="28" height="25" rx="2" fill="#d78c64"/><rect x="530" y="326" width="28" height="25" r