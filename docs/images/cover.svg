<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc"><title id="title">Feedback Inbox — The Correspondence Desk</title><desc id="desc">Cream paper letters arranged in a vermilion correspondence desk. An editorial product illustration, with no live metrics.</desc><rect width="1440" height="650" fill="#f1e8da"/><rect x="18" y="18" width="1404" height="614" fill="none" stroke="#c9b59c"/><path d="M74 101h1292M74 556h1292" stroke="#cbbba6"/><text x="80" y="70" font-family="monospace" font-size="13" letter-spacing="3" fill="#9b4c36">THE CORRESPONDENCE DESK / 01</text><text x="80" y="245" font-family="Georgia,serif" font-size="85" fill="#382c24">Feedback</text><text x="80" y="335" font-family="Georgia,serif" font-size="85" fill="#b9442e">Inbox.</text><text x="84" y="405" font-family="Georgia,serif" font-style="italic" font-size="27" fill="#806550">Every letter deserves a reply.</text><text x="84" y="463" font-family="monospace" font-size="12" letter-spacing="2" fill="#9b4c36">RECEIVE. SORT. READ. RESPOND.</text><g transform="translate(680 148)"><rect width="660" height="365" fill="#bb412c"/><g transform="translate(35 35) rotate(-5 90 135)"><rect x="8" width="170" height="250" fill="#fff9ec" stroke="#dfc4a2"/><text x="25" y="33" font-family="monospace" font-size="8" fill="#99745c">TO: THE TEAM</text><path d="M25 46h130M25 100h110M25 115h120" stroke="#d0bca5"/><text x="25" y="82" font-family="Georgia,serif" font-size="22" fill="#6c4732">The waiting.</text><path d="M0 147l90 18 98-18v140H0z" fill="#efc3aa" stroke="#c99575"/><path d="m0 147 94 75 94-75M0 287l72-82m116 82-72-82" fill="none" stroke="#c99575"/><text x="18" y="257" font-family="monospace" font-size="10" fill="#9b4c36">01 / OPEN</text></g><g transform="translate(235 45) rotate(3 90 135)"><rect x="8" width="170" height="250" fill="#fff9ec" stroke="#dfc4a2"/><text x="25" y="33" font-family="monospace" font-size="8" fill="#99745c">TO: THE TEAM</text><path d="M25 46h130M25 100h110M25 115h120" stroke="#d0bca5"/><text x="25" y="82" font-family="Georgia,serif" font-size="22" fill="#6c4732">The voices.</text><path d="M0 137l90 18 98-18v140H0z" fill="#e0c5a3" stroke="#bc9a70"/><path d="m0 137 94 75 94-75M0 277l72-82m116 82-72-82" fill="none" stroke="#bc9a70"/><text x="18" y="247" font-family="monospace" font-size="10" fill="#9b4c36">02 / READ</text></g><g transform="translate(438 60) rotate(-2 90 135)"><rect x="8" width="170" height="235" fill="#fff9ec" stroke="#dfc4a2"/><text x="25" y="33" font-family="monospace" font-size="8" fill="#99745c">TO: THE TEAM</text><path d="M25 46h130M25 100h110M25 115h120" stroke="#d0bca5"/><text x="25" y="82" font-family="Georgia,serif" font-size="22" fill="#6c4732">The replies.</text><path d="M0 122l90 18 98-18v140H0z" fill="#e6ddc7" stroke="#b7a98b"/><path d="m0 122 94 75 94-75M0 262l72-82m116 82-72-82" fill="none" stroke="#b7a98b"/><text x="18" y="232" font-family="monospace" font-size="10" fill="#9b4c36">03 / RESPOND</text></g></g><text x="80" y="603" font-family="monospace" font-size="12" letter-spacing="2" fill="#96775e">A WORKING DESK FOR EVERY VOICE.</text><text x="1110" y="603" font-family="monospace" font-size="12" letter-spacing="2" fill="#96775e">RUST · REACT · SQLITE</text></svg>